<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Getupia Demo</title>
<style>
body, html {
  margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  background: black;
  color: #020202;
  overflow: hidden;
}
.image {
  position: fixed;
  top: 0; left: 0;
  width:100%; height:100vh;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 1s ease;
}
.show {
  opacity: 1;
}
.hide {
  opacity: 0;
}
@keyframes zoomOut {
  from {transform: scale(1.8);}
  to { transform: scale(1.0); }
}
@keyframes moveUp {
  from { transform: scale(1) translateY(0px); }
  to { transform: scale(1) translateY(-100px); }
}

#text {
  position: fixed;
  bottom: 5%; left: 50%; transform: translateX(-50%);
  width: 80%; max-width: 800px;
  font-size: 1.25rem;
  text-align: center;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
}
#playButton {
  position: fixed;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  padding: 1rem 2rem;
  font-size: 1.25rem;
  background: rgba(255,255,255,0.8);
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>
<body>
<div id="image1" class="image"></div>
<div id="image2" class="image"></div>
<div id="text"></div>
<button id="playButton">Play</button>

<audio id="music" loop>
  <source src="2016-04-26_-_Peace_And_Happy_-_David_Fesliyan.mp3" type="audio/mp3">
</audio>

<script>
const texts = [
  "Ihr erwacht im Sand, eure Kleider durchweicht, den Geschmack von Salz auf euren Lippen. Während ihr euch langsam aufsetzt und versucht, euch die letzten Geschehnisse ins Gedächtnis zu rufen, kommt es euch vor, als würden sich diese vor eurem Verstand verstecken.",
  "Das Knurren eures Magens holt euch aus eurer vergeblichen Konzentration. Es gibt jetzt wichtigere Aufgaben, als das Greifen nach flüchtigen Erinnerungen."
];
let current = 0;

function typeText(text, elem, callback) {
  elem.innerHTML = '';
  let i = 0;
  let interval = setInterval(() => {
    elem.innerHTML += text[i];
    i++;
    if (i >= text.length) {
      clearInterval(interval);
      if (callback) callback();
    }
  }, 30);
}

function playScenes() {
  let sceneIndex = 0;

  function playNextScene() {
    // Alte Szene ausblenden
    if (sceneIndex > 0) {
      const prevScene = scenes[sceneIndex - 1];
      const prevImage = document.getElementById(prevScene.imageId);
      prevImage.classList.remove('show');
    }
    
    if (sceneIndex >= scenes.length) {
      console.log("Alle Szenen durch");
      return;
    }

    const scene = scenes[sceneIndex];
    const imgDiv = document.getElementById(scene.imageId);

    // Bildquelle der aktuellen Szene setzen
    imgDiv.style.backgroundImage = `url(${scene.imageUrl})`;
    imgDiv.classList.add('show');
    imgDiv.style.animation = scene.animation;

    sceneIndex++;
    setTimeout(playNextScene, scene.delay);
  }

  playNextScene();
}

function playTexts(){
  // Text abspielen
  const textDiv = document.getElementById('text');
  let textIndex = 0;

  function playNextText() {
    if (textIndex >= texts.length) {
      console.log("Alle Texte durch");
      return;
    }
    const text = texts[textIndex];
    textIndex++;
    typeText(text, textDiv, () => {
      setTimeout(playNextText, 8000);
    });
  }

  playNextText();
}
// Hier deine Szenen festlegen
const scenes = [
  {
    imageId: 'image1',
    imageUrl: 'Schiffbruechiger.png',
    animation: 'zoomOut 15s ease-out forwards',
    delay: 15000
  },
  {
    imageId: 'image2',
    imageUrl: 'isle_first_look.png',
    animation: 'moveUp 15s ease-out forwards',
    delay: 15000
  }
];

const playButton = document.getElementById('playButton');
playButton.addEventListener('click', (e) => {
  e.stopPropagation();
  const music = document.getElementById('music');
  music.play();
  playButton.style.display = 'none';
  playScenes();
  playTexts();

  // Nach dem Start Klick zum Verlassen
  document.body.addEventListener('click', () => {
    window.location.href = 'index.html';
  });
});
</script>
</body>
</html>
