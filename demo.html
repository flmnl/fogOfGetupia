<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Getupia Demo</title>
<style>
body, html {
  margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  background: black;
  color: #020202;
  overflow: hidden;
}
#image {
  position: fixed;
  top: 0; left: 0;
  width:100%; height:100vh;
  background: url('Schiffbruechiger.png') no-repeat center center;
  background-size: cover;
  transform: scale(1.8);
}
@keyframes zoomOut {
  to { transform: scale(1.0); }
}
#text {
  position: fixed;
  bottom: 5%; left: 50%; transform: translateX(-50%);
  width: 80%; max-width: 800px;
  font-size: 1.25rem;
  text-align: center;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
}
#playButton {
  position: fixed;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  padding: 1rem 2rem;
  font-size: 1.25rem;
  background: rgba(255,255,255,0.8);
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>
<body>
<div id="image"></div>
<div id="text"></div>
<button id="playButton">Play</button>

<audio id="music" loop>
  <source src="2016-04-26_-_Peace_And_Happy_-_David_Fesliyan.mp3" type="audio/mp3">
</audio>

<script>
const texts = [
  "ihr erwacht im Sand, eure Kleider durchweicht, den Geschmack von Salz auf euren Lippen. Während ihr euch langsam aufsetzt und versucht, euch die letzten Geschehnisse ins Gedächtnis zu rufen, kommt es euch vor, als würden sich diese vor eurem Verstand verstecken.",
  "Das Knurren eures Magens holt euch aus eurer vergeblichen Konzentration. Es gibt jetzt wichtigere Aufgaben, als das Greifen nach flüchtigen Erinnerungen."
];
let current = 0;

function typeText(text, elem, callback) {
  elem.innerHTML = '';
  let i = 0;
  let interval = setInterval(() => {
    elem.innerHTML += text[i];
    i++;
    if (i >= text.length) {
      clearInterval(interval);
      if (callback) callback();
    }
  }, 30);
}

function playScene() {
  document.getElementById('image').style.animation = 'zoomOut 15s ease-out forwards';
  const textDiv = document.getElementById('text');
  typeText(texts[0], textDiv, () => {
    setTimeout(() => {
      typeText(texts[1], textDiv);
    }, 8000);
  });
}

const playButton = document.getElementById('playButton');
playButton.addEventListener('click', (e) => {
  e.stopPropagation();
  const music = document.getElementById('music');
  music.play();
  playButton.style.display = 'none';
  playScene();

  // Jetzt erst den globalen Klick zum Verlassen registrieren
  document.body.addEventListener('click', () => {
    window.location.href = 'index.html';
  });
});
</script>
</body>
</html>
